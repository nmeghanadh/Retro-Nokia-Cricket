<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nokia Retro Cricket 2006 - Family Tournament</title>
    <!-- MQTT.js via CDN for 100% reliable multi-network real-time room sync -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body {
            background-color: #0b0f19;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #f8fafc;
        }
        .phone-body {
            background: linear-gradient(135deg, #475569 0%, #1e293b 100%);
            padding: 25px;
            border-radius: 45px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8), inset 0 2px 6px rgba(255,255,255,0.2);
            border: 4px solid #64748b;
            width: 330px;
            text-align: center;
        }
        .brand {
            font-size: 13px;
            font-weight: bold;
            color: #cbd5e1;
            letter-spacing: 4px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        .lcd-screen {
            background: #9ead86; 
            border: 5px solid #2b3822;
            border-radius: 8px;
            padding: 8px;
            width: 296px;
            height: 400px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }
        canvas {
            background: #8b9d71;
            display: block;
            margin: 0 auto;
            border: 2px solid #2b3822;
        }
        .lcd-header {
            font-size: 12px;
            color: #111;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            border-bottom: 2px dashed #2b3822;
            padding-bottom: 4px;
            background: rgba(139, 157, 113, 0.9);
        }
        .lcd-footer {
            font-size: 11px;
            color: #2b3822;
            font-weight: bold;
            text-align: center;
            height: 24px;
            background: rgba(139, 157, 113, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 15px;
            padding: 0 4px;
        }
        .key {
            background: #334155;
            color: #fff;
            border: none;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 0 #0f172a;
            transition: 0.05s;
        }
        .key:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #0f172a;
        }
        .key-action {
            background: #059669;
            box-shadow: 0 4px 0 #047857;
            font-size: 11px;
            grid-column: span 3;
        }
        .screen-overlay {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 280px;
            height: 384px;
            background: rgba(158, 173, 134, 0.97);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            color: #111;
            padding: 12px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .hidden { display: none !important; }
        input {
            background: #8b9d71;
            border: 2px solid #2b3822;
            padding: 6px;
            font-family: inherit;
            font-weight: bold;
            text-align: center;
            color: #111;
            margin-bottom: 6px;
            width: 85%;
            border-radius: 4px;
        }
        .leaderboard-table {
            width: 100%;
            font-size: 10px;
            border-collapse: collapse;
            margin-top: 4px;
            text-align: left;
        }
        .leaderboard-table th, .leaderboard-table td {
            padding: 2px;
            border-bottom: 1px dashed #2b3822;
        }
    </style>
</head>
<body>

<div class="phone-body">
    <div class="brand">Nokia 1110i (2006)</div>
    
    <div class="lcd-screen">
        
        <!-- ROOM SETUP SCREEN -->
        <div id="overlay" class="screen-overlay">
            <h3 style="margin:0 0 3px 0;">🏏 TOURNAMENT LOBBY</h3>
            <p style="font-size:10px; margin:2px 0 5px 0; text-align:center;">
                2 Overs (12 Balls) | [1] Left | [3] Right | [4,6] Lofted
            </p>
            <input type="text" id="player-name" placeholder="Your Name (e.g. Sasi)" maxlength="12">
            <input type="text" id="custom-room-input" placeholder="Room Code (e.g. DIWALI)" maxlength="10">
            <div style="display: flex; gap: 5px; width: 85%; margin-bottom: 4px;">
                <button class="key" style="background:#2b3822; color:#fff; flex:1; padding:7px; font-size:11px;" onclick="hostRoom()">HOST</button>
                <button class="key" style="background:#047857; color:#fff; flex:1; padding:7px; font-size:11px;" onclick="joinRoom()">JOIN</button>
            </div>
            <div id="status-msg" style="font-size:10px; margin-top:2px; font-weight:bold; color:#111;"></div>
        </div>

        <!-- LCD HEADER -->
        <div class="lcd-header">
            <span>SCR: <b id="score-val">0</b>/<b id="wickets-val">0</b></span>
            <span>BALL: <b id="ball-val">1</b>/12</span>
        </div>

        <!-- CANVAS GAME PITCH -->
        <canvas id="gameCanvas" width="280" height="270"></canvas>

        <!-- LCD FOOTER -->
        <div class="lcd-footer" id="comm-text">Choose shot [1, 3, 4, 6]!</div>
    </div>

    <!-- RETRO KEYPAD -->
    <div class="keypad">
        <button class="key" onclick="playShot(1)">1<br><small>Left</small></button>
        <button class="key" onclick="playShot(2)">2<br><small>Block</small></button>
        <button class="key" onclick="playShot(3)">3<br><small>Right</small></button>
        <button class="key" onclick="playShot(4)">4<br><small>Lofted</small></button>
        <button class="key" onclick="playShot(5)">5<br><small>Straight</small></button>
        <button class="key" onclick="playShot(6)">6<br><small>Power</small></button>
        <button class="key key-action" onclick="playShot(5)">⚡ STRAIGHT DRIVE (5 / Space)</button>
    </div>
</div>

<script>
    let mqttClient;
    let isHost = false;
    let roomCode = "";
    let roomPlayers = {}; 
    let playerName = "Player";

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type, duration) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = type || 'square';
        osc.frequency.value = freq || 440;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    // Haptic Vibration Helper
    function vibratePhone(pattern) {
        if ("vibrate" in navigator) {
            navigator.vibrate(pattern);
        }
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let gameState = {
        score: 0,
        wickets: 0,
        ball: 1,
        maxBalls: 12, // 2 Overs = 12 Balls
        status: 'IDLE', 
        ballX: 140,
        ballY: 25,
        targetX: 140,
        targetY: 25,
        ballSpeedX: 0,
        ballSpeedY: 2.2,
        batSwinging: false,
        swingFrame: 0,
        shotDirection: 5,
        popupText: '',
        popupTimer: 0,
        countdownText: ''
    };

    let fielders = [
        { x: 45, y: 70, baseX: 45, baseY: 70, dir: 1 },
        { x: 235, y: 70, baseX: 235, baseY: 70, dir: -1 },
        { x: 100, y: 32, baseX: 100, baseY: 32, dir: 1 },
        { x: 180, y: 32, baseX: 180, baseY: 32, dir: -1 }
    ];

    // --- CONNECT TO MQTT BROKER ---
    function connectMQTT(callback) {
        if (mqttClient && mqttClient.connected) {
            callback();
            return;
        }
        document.getElementById('status-msg').innerText = "Connecting to server...";
        
        mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
            clientId: 'nokia_' + Math.random().toString(16).substring(2, 10)
        });

        mqttClient.on('connect', () => {
            document.getElementById('status-msg').innerText = "";
            callback();
        });

        mqttClient.on('error', (err) => {
            alert("Network connection error. Check your internet.");
            document.getElementById('status-msg').innerText = "";
        });

        mqttClient.on('message', (topic, payload) => {
            try {
                let data = JSON.parse(payload.toString());
                handleIncomingMessage(data);
            } catch(e) {}
        });
    }

    // --- HOST ROOM SETUP ---
    function hostRoom() {
        playerName = document.getElementById('player-name').value.trim() || "Host";
        roomCode = document.getElementById('custom-room-input').value.trim().toUpperCase();

        if (!playerName || !roomCode) {
            alert("Please enter your name and a room code!");
            return;
        }

        connectMQTT(() => {
            isHost = true;
            let topic = `nokia/cricket/room/${roomCode}`;
            mqttClient.subscribe(topic, () => {
                roomPlayers[playerName] = { score: 0, wickets: 0, status: 'LOBBY' };
                showHostLobby();
            });
        });
    }

    function showHostLobby() {
        let listHTML = '';
        Object.keys(roomPlayers).forEach(name => {
            let p = roomPlayers[name];
            listHTML += `<tr><td>${name}</td><td><b>${p.score}/${p.wickets}</b></td><td>${p.status}</td></tr>`;
        });

        const overlay = document.getElementById('overlay');
        overlay.classList.remove('hidden');
        overlay.innerHTML = `
            <h3 style="margin:0 0 3px 0;">🛡️ HOST LOBBY</h3>
            <p style="font-size:10px; margin:0 0 4px 0;">Code: <b style="color:#047857">${roomCode}</b></p>
            <div style="max-height:130px; overflow-y:auto; width:100%;">
                <table class="leaderboard-table">
                    <tr><th>Player</th><th>Score</th><th>Status</th></tr>
                    ${listHTML}
                </table>
            </div>
            <button class="key" style="background:#047857; color:#fff; width:100%; padding:8px; font-size:11px; margin-top:6px;" onclick="hostStartMatch()">🚀 START MATCH FOR ALL</button>
            <button class="key" style="background:#2b3822; color:#fff; width:100%; padding:6px; font-size:10px; margin-top:4px;" onclick="hostRevealResults()">📢 REVEAL LEADERBOARD</button>
        `;
    }

    function publishMessage(msgObj) {
        if (mqttClient && mqttClient.connected) {
            mqttClient.publish(`nokia/cricket/room/${roomCode}`, JSON.stringify(msgObj));
        }
    }

    function hostStartMatch() {
        if (!isHost) return;
        Object.keys(roomPlayers).forEach(name => {
            roomPlayers[name] = { score: 0, wickets: 0, status: 'PLAYING' };
        });

        publishMessage({ type: 'START_MATCH', players: roomPlayers });
        startMyInnings();
    }

    function hostRevealResults() {
        if (!isHost) return;
        publishMessage({ type: 'SHOW_LEADERBOARD', leaderboard: roomPlayers });
        renderLeaderboardScreen(roomPlayers);
    }

    // --- JOIN ROOM SETUP ---
    function joinRoom() {
        playerName = document.getElementById('player-name').value.trim() || "Player";
        roomCode = document.getElementById('custom-room-input').value.trim().toUpperCase();

        if (!playerName || !roomCode) {
            alert("Please enter your name and the room code!");
            return;
        }

        connectMQTT(() => {
            let topic = `nokia/cricket/room/${roomCode}`;
            mqttClient.subscribe(topic, () => {
                publishMessage({ type: 'JOIN_ROOM', name: playerName });
                showClientLobby(roomCode);
            });
        });
    }

    function showClientLobby(code) {
        gameState.status = 'LOBBY_WAIT';
        let listHTML = '';
        Object.keys(roomPlayers).forEach(name => {
            listHTML += `<li>${name}</li>`;
        });

        const overlay = document.getElementById('overlay');
        overlay.classList.remove('hidden');
        overlay.innerHTML = `
            <h3 style="margin:0 0 3px 0;">⏳ WAITING FOR HOST</h3>
            <p style="font-size:10px; margin:2px 0;">Room: <b>${code}</b></p>
            <p style="font-size:10px; color:#333; margin:2px 0;">Connected Players:</p>
            <ul style="font-size:10px; text-align:left; max-height:100px; overflow-y:auto; margin:0 auto; padding-left:20px;">
                ${listHTML}
            </ul>
            <p style="font-size:9px; color:#047857; margin-top:10px; font-weight:bold;">Game will start automatically when Host clicks Start!</p>
        `;
    }

    // --- INCOMING MESSAGE DISPATCHER ---
    function handleIncomingMessage(data) {
        if (data.type === 'JOIN_ROOM') {
            roomPlayers[data.name] = { score: 0, wickets: 0, status: 'LOBBY' };
            if (isHost) {
                publishMessage({ type: 'UPDATE_LOBBY', players: roomPlayers });
                showHostLobby();
            }
        } else if (data.type === 'UPDATE_LOBBY') {
            roomPlayers = data.players;
            if (gameState.status === 'LOBBY_WAIT') showClientLobby(roomCode);
        } else if (data.type === 'START_MATCH') {
            roomPlayers = data.players || roomPlayers;
            startMyInnings();
        } else if (data.type === 'SUBMIT_SCORE') {
            roomPlayers[data.name] = { score: data.score, wickets: data.wickets, status: data.status };
            if (isHost && gameState.status === 'WAITING_HOST') showHostLobby();
        } else if (data.type === 'SHOW_LEADERBOARD') {
            roomPlayers = data.leaderboard;
            renderLeaderboardScreen(roomPlayers);
        }
    }

    function sendMyScore(statusVal) {
        roomPlayers[playerName] = { score: gameState.score, wickets: gameState.wickets, status: statusVal };
        publishMessage({ type: 'SUBMIT_SCORE', name: playerName, score: gameState.score, wickets: gameState.wickets, status: statusVal });
    }

    function startMyInnings() {
        document.getElementById('overlay').classList.add('hidden');
        gameState = {
            score: 0,
            wickets: 0,
            ball: 1,
            maxBalls: 12,
            status: 'COUNTDOWN',
            ballX: 140,
            ballY: 25,
            targetX: 140,
            targetY: 25,
            ballSpeedX: 0,
            ballSpeedY: 2.2,
            batSwinging: false,
            swingFrame: 0,
            shotDirection: 5,
            popupText: '',
            popupTimer: 0,
            countdownText: '3'
        };
        
        document.getElementById('score-val').innerText = '0';
        document.getElementById('wickets-val').innerText = '0';
        document.getElementById('ball-val').innerText = '1';
        sendMyScore('PLAYING');

        runCountdown(3);
    }

    function runCountdown(count) {
        if (count > 0) {
            gameState.countdownText = `${count}`;
            document.getElementById('comm-text').innerText = `GET READY... ${count}`;
            playBeep(400, 'square', 0.15);
            vibratePhone(30);
            setTimeout(() => {
                runCountdown(count - 1);
            }, 1000);
        } else {
            gameState.countdownText = 'PLAY!';
            document.getElementById('comm-text').innerText = `PLAY! 🏏`;
            playBeep(900, 'square', 0.3);
            vibratePhone([50, 50, 50]);
            setTimeout(() => {
                gameState.countdownText = '';
                nextDelivery();
            }, 600);
        }
    }

    function nextDelivery() {
        if (gameState.ball > gameState.maxBalls || gameState.wickets >= 3) {
            endInnings();
            return;
        }
        gameState.status = 'BOWLING';
        gameState.ballX = 140;
        gameState.ballY = 25;
        
        // Randomized delivery speeds (Fast yorkers, slow loopers, standard)
        let rand = Math.random();
        if (rand < 0.35) {
            gameState.ballSpeedY = 3.6; // Fast Yorker!
            document.getElementById('comm-text').innerText = "Fast delivery! Watch out!";
        } else if (rand < 0.7) {
            gameState.ballSpeedY = 1.4; // Slow looper
            document.getElementById('comm-text').innerText = "Slow looping delivery...";
        } else {
            gameState.ballSpeedY = 2.3; // Standard
            document.getElementById('comm-text').innerText = "Bowler running in...";
        }

        document.getElementById('ball-val').innerText = gameState.ball;
        playBeep(300, 'triangle', 0.1);
    }

    function playShot(direction) {
        if (gameState.status !== 'BOWLING') return;

        gameState.shotDirection = direction;
        gameState.batSwinging = true;
        gameState.swingFrame = 12;
        playBeep(800, 'square', 0.1);

        let batsmanY = 220;
        let timingDiff = gameState.ballY - batsmanY; // Negative = approaching, Positive = passed

        if (timingDiff > 8) {
            // Ball already passed the batsman -> Too late! Clean bowled!
            gameState.wickets++;
            document.getElementById('comm-text').innerText = "TOO LATE! Clean bowled! ☝️";
            gameState.status = 'IDLE';
            playBeep(150, 'sawtooth', 0.4);
            vibratePhone([150, 75, 150]);
            queueNextBall();
        } else if (timingDiff < -25) {
            // Swung way too early
            document.getElementById('comm-text').innerText = "Too early! Defended (0)";
            gameState.status = 'IDLE';
            playBeep(400, 'sawtooth', 0.1);
            vibratePhone(40);
            queueNextBall();
        } else {
            // Valid striking zone
            let absDiff = Math.abs(timingDiff);
            let isPerfect = absDiff < 5; // Strict timing window

            if (isPerfect) {
                processBattingContact(true);
            } else {
                // Good / Edge timing -> 1 or 2 runs or defense
                if (Math.abs(timingDiff) > 14) {
                    document.getElementById('comm-text').innerText = "Defended safely (0)";
                    gameState.status = 'IDLE';
                    playBeep(400, 'sawtooth', 0.1);
                    vibratePhone(40);
                    queueNextBall();
                } else {
                    processBattingContact(false);
                }
            }
        }

        document.getElementById('score-val').innerText = gameState.score;
        document.getElementById('wickets-val').innerText = gameState.wickets;
        sendMyScore('PLAYING');
    }

    function processBattingContact(isPerfect) {
        let targetX = 140;
        let targetY = 10;
        let runs = 1;

        if (gameState.shotDirection === 1) {
            targetX = 15;   
            targetY = 135;
            runs = isPerfect ? 4 : 1;
        } else if (gameState.shotDirection === 3) {
            targetX = 265;  
            targetY = 135;
            runs = isPerfect ? 4 : 1;
        } else if (gameState.shotDirection === 4 || gameState.shotDirection === 6) {
            targetX = 140 + (Math.random() * 60 - 30);
            targetY = -10;  
            runs = isPerfect ? 6 : 2;
        } else {
            targetX = 140;
            targetY = 12;   
            runs = isPerfect ? 4 : 2;
        }

        let caughtOut = false;
        if (isPerfect && (gameState.shotDirection === 4 || gameState.shotDirection === 6)) {
            fielders.forEach(f => {
                let distToFielder = Math.hypot(f.x - targetX, f.y - targetY);
                if (distToFielder < 28) caughtOut = true;
            });
        }

        if (caughtOut) {
            gameState.wickets++;
            gameState.status = 'FLYING';
            gameState.targetX = targetX;
            gameState.targetY = targetY;
            document.getElementById('comm-text').innerText = "CAUGHT OUT near boundary! ☝️";
            playBeep(120, 'sawtooth', 0.5);
            vibratePhone([150, 75, 150]);
            
            let dx = targetX - gameState.ballX;
            let dy = targetY - gameState.ballY;
            let dist = Math.sqrt(dx*dx + dy*dy);
            gameState.ballSpeedX = (dx / dist) * 4.5;
            gameState.ballSpeedY = (dy / dist) * 4.5;
            sendMyScore('PLAYING');
            queueNextBall();
            return;
        }

        gameState.score += runs;
        gameState.popupText = `+${runs}`;
        gameState.popupTimer = 40;

        if (runs === 6 || runs === 4) {
            vibratePhone([60, 40, 80]);
        } else {
            vibratePhone(50);
        }

        launchBallFlight(targetX, targetY, runs);
        if (runs === 6) {
            playBeep(1200, 'square', 0.3);
        } else {
            playBeep(900, 'square', 0.15);
        }
    }

    function launchBallFlight(targetX, targetY, runs) {
        gameState.status = 'FLYING';
        gameState.targetX = targetX;
        gameState.targetY = targetY;
        
        let dx = targetX - gameState.ballX;
        let dy = targetY - gameState.ballY;
        let dist = Math.sqrt(dx*dx + dy*dy);

        gameState.ballSpeedX = (dx / dist) * 5;
        gameState.ballSpeedY = (dy / dist) * 5;

        if (runs === 6) {
            document.getElementById('comm-text').innerText = "MAXIMUM! OVER THE ROPE! 🚀";
        } else if (runs === 4) {
            document.getElementById('comm-text').innerText = "FOUR BOUNDARY! 💥";
        } else {
            document.getElementById('comm-text').innerText = `Good shot! +${runs} run`;
        }
    }

    function queueNextBall() {
        setTimeout(() => {
            gameState.ball++;
            nextDelivery();
        }, 1600);
    }

    window.addEventListener('keydown', (e) => {
        if (['1', '3', '4', '5', '6'].includes(e.key)) {
            e.preventDefault();
            playShot(parseInt(e.key));
        } else if (e.code === 'Space') {
            e.preventDefault();
            playShot(5);
        }
    });

    function endInnings() {
        gameState.status = 'WAITING_HOST';
        sendMyScore('FINISHED');
        playBeep(200, 'sawtooth', 0.5);
        vibratePhone([100, 100, 100]);

        if (isHost) {
            showHostLobby();
        } else {
            const overlay = document.getElementById('overlay');
            overlay.classList.remove('hidden');
            overlay.innerHTML = `
                <h3 style="margin:0 0 5px 0;">⏳ INNINGS OVER</h3>
                <p style="font-size:11px; text-align:center; margin:10px 0;">Score: <b>${gameState.score}/${gameState.wickets}</b></p>
                <p style="font-size:10px; color:#333; text-align:center; font-style:italic;">Waiting for Host to review scores and reveal final standings...</p>
            `;
        }
    }

    function renderLeaderboardScreen(data) {
        const sortedPlayers = Object.keys(data).map(name => ({
            name: name,
            score: data[name].score || 0,
            wickets: data[name].wickets || 0
        })).sort((a, b) => {
            if (b.score !== a.score) return b.score - a.score;
            return a.wickets - b.wickets;
        });

        let leaderboardHTML = `
            <h3 style="margin:0 0 3px 0;">🏆 FINAL STANDINGS</h3>
            <table class="leaderboard-table">
                <tr><th>Rank</th><th>Player</th><th>Score</th></tr>
        `;

        sortedPlayers.forEach((p, idx) => {
            let rankIcon = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `${idx+1}.`;
            let isMe = p.name === playerName ? 'style="color:#047857; font-weight:bold;"' : '';
            leaderboardHTML += `
                <tr ${isMe}>
                    <td>${rankIcon}</td>
                    <td>${p.name}</td>
                    <td><b>${p.score}/${p.wickets}</b></td>
                </tr>
            `;
        });

        if (isHost) {
            leaderboardHTML += `
                </table>
                <button class="key" style="background:#047857; color:#fff; width:100%; padding:7px; font-size:11px; margin-top:6px;" onclick="hostStartMatch()">🔄 PLAY AGAIN FOR ALL</button>
            `;
        } else {
            leaderboardHTML += `
                </table>
                <p style="font-size:9px; color:#333; margin-top:6px; font-style:italic; text-align:center;">Waiting for Host to start next round...</p>
            `;
        }

        const overlay = document.getElementById('overlay');
        overlay.classList.remove('hidden');
        overlay.innerHTML = leaderboardHTML;
    }

    function gameLoop() {
        ctx.fillStyle = '#8b9d71';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Boundary line oval
        ctx.strokeStyle = '#2b3822';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.ellipse(140, 130, 128, 115, 0, 0, Math.PI * 2);
        ctx.stroke();

        // Pitch Strip
        ctx.fillStyle = '#7a8c60';
        ctx.fillRect(120, 20, 40, 210);
        ctx.strokeStyle = '#2b3822';
        ctx.strokeRect(120, 20, 40, 210);

        ctx.beginPath();
        ctx.moveTo(120, 215);
        ctx.lineTo(160, 215);
        ctx.stroke();

        ctx.fillStyle = '#2b3822';
        ctx.fillRect(133, 225, 3, 10);
        ctx.fillRect(137, 225, 3, 10);
        ctx.fillRect(141, 225, 3, 10);

        fielders.forEach(f => {
            f.x += f.dir * 0.4;
            if (Math.abs(f.x - f.baseX) > 20) f.dir *= -1;

            ctx.fillStyle = '#2b3822';
            ctx.fillRect(f.x, f.y, 6, 8);
            ctx.fillRect(f.x - 2, f.y - 3, 10, 3);
        });

        // Countdown Overlay Display on Canvas
        if (gameState.status === 'COUNTDOWN') {
            ctx.fillStyle = '#111';
            ctx.font = 'bold 36px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText(gameState.countdownText, canvas.width / 2, canvas.height / 2 - 10);
            ctx.textAlign = 'left';
        }

        if (gameState.status === 'BOWLING') {
            gameState.ballY += gameState.ballSpeedY;
            if (gameState.ballY > 235) {
                gameState.status = 'IDLE';
                gameState.wickets++;
                document.getElementById('wickets-val').innerText = gameState.wickets;
                document.getElementById('comm-text').innerText = "BOWLED! Missed completely!";
                playBeep(120, 'sawtooth', 0.4);
                vibratePhone([150, 75, 150]);
                sendMyScore('PLAYING');
                queueNextBall();
            }
        } else if (gameState.status === 'FLYING') {
            gameState.ballX += gameState.ballSpeedX;
            gameState.ballY += gameState.ballSpeedY;

            let distToTarget = Math.hypot(gameState.targetX - gameState.ballX, gameState.targetY - gameState.ballY);
            if (distToTarget < 5 || gameState.ballY < -15 || gameState.ballY > 275 || gameState.ballX < -5 || gameState.ballX > 285) {
                gameState.status = 'IDLE';
                queueNextBall();
            }
        }

        if (gameState.status !== 'COUNTDOWN') {
            ctx.fillStyle = '#111';
            ctx.fillRect(gameState.ballX - 3, gameState.ballY - 3, 6, 6);
        }

        if (gameState.popupTimer > 0) {
            ctx.fillStyle = '#111';
            ctx.font = 'bold 16px Courier New';
            ctx.fillText(gameState.popupText, 130, 100);
            gameState.popupTimer--;
        }

        ctx.fillStyle = '#111';
        ctx.fillRect(130, 205, 12, 18);
        ctx.fillRect(132, 200, 8, 5);

        if (gameState.batSwinging) {
            let batX = 122;
            if (gameState.shotDirection === 1) batX = 112;
            if (gameState.shotDirection === 3) batX = 138;
            ctx.fillRect(batX, 198, 16, 5);
            gameState.swingFrame--;
            if (gameState.swingFrame <= 0) gameState.batSwinging = false;
        } else {
            ctx.fillRect(126, 208, 5, 14);
        }

        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>

</body>
</html>
