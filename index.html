<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nokia Retro Cricket 2006 - Polished Edition</title>
    <style>
        body {
            background-color: #0b0f19;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #f8fafc;
        }
        /* Sleek Modern-Retro Nokia Phone Shell */
        .phone-body {
            background: linear-gradient(135deg, #475569 0%, #1e293b 100%);
            padding: 25px;
            border-radius: 45px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8), inset 0 2px 6px rgba(255,255,255,0.2);
            border: 4px solid #64748b;
            width: 330px;
            text-align: center;
        }
        .brand {
            font-size: 13px;
            font-weight: bold;
            color: #cbd5e1;
            letter-spacing: 4px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        /* Crisp Monochrome LCD Screen */
        .lcd-screen {
            background: #9ead86; 
            border: 5px solid #2b3822;
            border-radius: 8px;
            padding: 8px;
            width: 296px;
            height: 400px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }
        canvas {
            background: #8b9d71;
            display: block;
            margin: 0 auto;
            border: 2px solid #2b3822;
        }
        .lcd-header {
            font-size: 12px;
            color: #111;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            border-bottom: 2px dashed #2b3822;
            padding-bottom: 4px;
            background: rgba(139, 157, 113, 0.9);
        }
        .lcd-footer {
            font-size: 11px;
            color: #2b3822;
            font-weight: bold;
            text-align: center;
            height: 24px;
            background: rgba(139, 157, 113, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Tactile Retro Keypad */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 15px;
            padding: 0 4px;
        }
        .key {
            background: #334155;
            color: #fff;
            border: none;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 0 #0f172a;
            transition: 0.05s;
        }
        .key:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #0f172a;
        }
        .key-action {
            background: #059669;
            box-shadow: 0 4px 0 #047857;
            font-size: 11px;
            grid-column: span 3;
        }
        .screen-overlay {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 280px;
            height: 384px;
            background: rgba(158, 173, 134, 0.97);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            color: #111;
            padding: 20px;
            box-sizing: border-box;
        }
        .hidden { display: none !important; }
        input {
            background: #8b9d71;
            border: 2px solid #2b3822;
            padding: 8px;
            font-family: inherit;
            font-weight: bold;
            text-align: center;
            color: #111;
            margin-bottom: 15px;
            width: 80%;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="phone-body">
    <div class="brand">Nokia 1110i (2006)</div>
    
    <div class="lcd-screen">
        
        <!-- START / GAME OVER SCREEN -->
        <div id="overlay" class="screen-overlay">
            <h3 style="margin:0 0 5px 0;">🏏 RETRO CRICKET 2006</h3>
            <p style="font-size:11px; margin:5px 0 15px 0; text-align:center; line-height: 1.4;">
                <b>Controls:</b><br>
                [1] Left Shot | [3] Right Shot<br>
                [4] Lofted Drive | [6] Power Slog<br>
                Timing is everything!
            </p>
            <input type="text" id="player-name" placeholder="Batsman Name" maxlength="10" value="Legend">
            <button class="key" style="background:#2b3822; color:#fff; width:100%; padding:10px; font-size:14px;" onclick="startGame()">START INNINGS</button>
        </div>

        <!-- LCD HEADER -->
        <div class="lcd-header">
            <span>SCR: <b id="score-val">0</b>/<b id="wickets-val">0</b></span>
            <span>BALL: <b id="ball-val">1</b>/6</span>
        </div>

        <!-- CANVAS GAME PITCH & OUTFIELD -->
        <canvas id="gameCanvas" width="280" height="270"></canvas>

        <!-- LCD FOOTER -->
        <div class="lcd-footer" id="comm-text">Choose shot [1, 3, 4, 6]!</div>
    </div>

    <!-- RETRO KEYPAD -->
    <div class="keypad">
        <button class="key" onclick="playShot(1)">1<br><small>Left</small></button>
        <button class="key" onclick="playShot(2)">2<br><small>Block</small></button>
        <button class="key" onclick="playShot(3)">3<br><small>Right</small></button>
        <button class="key" onclick="playShot(4)">4<br><small>Lofted</small></button>
        <button class="key" onclick="playShot(5)">5<br><small>Straight</small></button>
        <button class="key" onclick="playShot(6)">6<br><small>Power</small></button>
        <button class="key key-action" onclick="playShot(5)">⚡ STRAIGHT DRIVE (5 / Space)</button>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type, duration) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = type || 'square';
        osc.frequency.value = freq || 440;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let gameState = {
        score: 0,
        wickets: 0,
        ball: 1,
        maxBalls: 6,
        status: 'IDLE', // 'IDLE', 'BOWLING', 'FLYING'
        ballX: 140,
        ballY: 25,
        targetX: 140,
        targetY: 25,
        ballSpeedX: 0,
        ballSpeedY: 2.2,
        batSwinging: false,
        swingFrame: 0,
        shotDirection: 5,
        popupText: '',
        popupTimer: 0
    };

    let fielders = [
        { x: 45, y: 70, baseX: 45, baseY: 70, dir: 1 },
        { x: 235, y: 70, baseX: 235, baseY: 70, dir: -1 },
        { x: 100, y: 32, baseX: 100, baseY: 32, dir: 1 },
        { x: 180, y: 32, baseX: 180, baseY: 32, dir: -1 }
    ];

    let playerName = "Legend";

    function startGame() {
        const nameInput = document.getElementById('player-name');
        if (nameInput) {
            playerName = nameInput.value.trim() || "Legend";
        }
        
        document.getElementById('overlay').classList.add('hidden');
        gameState = {
            score: 0,
            wickets: 0,
            ball: 1,
            maxBalls: 6,
            status: 'IDLE',
            ballX: 140,
            ballY: 25,
            targetX: 140,
            targetY: 25,
            ballSpeedX: 0,
            ballSpeedY: 2.2,
            batSwinging: false,
            swingFrame: 0,
            shotDirection: 5,
            popupText: '',
            popupTimer: 0
        };
        
        document.getElementById('score-val').innerText = '0';
        document.getElementById('wickets-val').innerText = '0';
        document.getElementById('ball-val').innerText = '1';
        
        nextDelivery();
        playBeep(600, 'square', 0.2);
    }

    function nextDelivery() {
        if (gameState.ball > gameState.maxBalls || gameState.wickets >= 3) {
            endGame();
            return;
        }
        gameState.status = 'BOWLING';
        gameState.ballX = 140;
        gameState.ballY = 25;
        gameState.ballSpeedY = 2.0 + Math.random() * 1.2;
        document.getElementById('ball-val').innerText = gameState.ball;
        document.getElementById('comm-text').innerText = "Bowler running in...";
        playBeep(300, 'triangle', 0.1);
    }

    function playShot(direction) {
        if (gameState.status !== 'BOWLING') return;

        gameState.shotDirection = direction;
        gameState.batSwinging = true;
        gameState.swingFrame = 12;
        playBeep(800, 'square', 0.1);

        let batsmanY = 220;
        let timingDiff = Math.abs(gameState.ballY - batsmanY);

        if (timingDiff < 16) {
            processBattingContact(true); // Perfect timing -> boundary
        } else if (timingDiff < 30) {
            processBattingContact(false); // Good timing -> 1-2 runs
        } else if (timingDiff < 40) {
            document.getElementById('comm-text').innerText = "Defended safely (0)";
            gameState.status = 'IDLE';
            playBeep(400, 'sawtooth', 0.1);
            queueNextBall();
        } else {
            gameState.wickets++;
            document.getElementById('comm-text').innerText = "BOWLED! Timber rattled! ☝️";
            gameState.status = 'IDLE';
            playBeep(150, 'sawtooth', 0.4);
            queueNextBall();
        }

        document.getElementById('score-val').innerText = gameState.score;
        document.getElementById('wickets-val').innerText = gameState.wickets;
    }

    function processBattingContact(isPerfect) {
        let targetX = 140;
        let targetY = 10;
        let runs = 1;

        // Direction mapping with explicit targets *beyond* or *on* the boundary oval
        if (gameState.shotDirection === 1) {
            targetX = 15;   // Crosses left boundary
            targetY = 135;
            runs = isPerfect ? 4 : 1;
        } else if (gameState.shotDirection === 3) {
            targetX = 265;  // Crosses right boundary
            targetY = 135;
            runs = isPerfect ? 4 : 1;
        } else if (gameState.shotDirection === 4 || gameState.shotDirection === 6) {
            targetX = 140 + (Math.random() * 60 - 30);
            targetY = -10;  // Flies cleanly past the top boundary rope!
            runs = isPerfect ? 6 : 2;
        } else {
            targetX = 140;
            targetY = 12;   // Straight boundary hit
            runs = isPerfect ? 4 : 2;
        }

        // Caught out check for lofted shots
        let caughtOut = false;
        if (isPerfect && (gameState.shotDirection === 4 || gameState.shotDirection === 6)) {
            fielders.forEach(f => {
                let distToFielder = Math.hypot(f.x - targetX, f.y - targetY);
                if (distToFielder < 28) {
                    caughtOut = true;
                }
            });
        }

        if (caughtOut) {
            gameState.wickets++;
            gameState.status = 'FLYING';
            gameState.targetX = targetX;
            gameState.targetY = targetY;
            document.getElementById('comm-text').innerText = "CAUGHT OUT near boundary! ☝️";
            playBeep(120, 'sawtooth', 0.5);
            
            let dx = targetX - gameState.ballX;
            let dy = targetY - gameState.ballY;
            let dist = Math.sqrt(dx*dx + dy*dy);
            gameState.ballSpeedX = (dx / dist) * 4.5;
            gameState.ballSpeedY = (dy / dist) * 4.5;
            queueNextBall();
            return;
        }

        gameState.score += runs;
        
        // Trigger popup text
        gameState.popupText = `+${runs}`;
        gameState.popupTimer = 40;

        launchBallFlight(targetX, targetY, runs);
        if (runs === 6) {
            playBeep(1200, 'square', 0.3);
        } else {
            playBeep(900, 'square', 0.15);
        }
    }

    function launchBallFlight(targetX, targetY, runs) {
        gameState.status = 'FLYING';
        gameState.targetX = targetX;
        gameState.targetY = targetY;
        
        let dx = targetX - gameState.ballX;
        let dy = targetY - gameState.ballY;
        let dist = Math.sqrt(dx*dx + dy*dy);
        
        gameState.ballSpeedX = (dx / dist) * 5;
        gameState.ballSpeedY = (dy / dist) * 5;

        if (runs === 6) {
            document.getElementById('comm-text').innerText = "MAXIMUM! OVER THE ROPE! 🚀";
        } else if (runs === 4) {
            document.getElementById('comm-text').innerText = "FOUR RUNS! Boundary! 💥";
        } else {
            document.getElementById('comm-text').innerText = `Good shot! +${runs} run`;
        }
    }

    function queueNextBall() {
        setTimeout(() => {
            gameState.ball++;
            nextDelivery();
        }, 1600);
    }

    window.addEventListener('keydown', (e) => {
        if (['1', '3', '4', '5', '6'].includes(e.key)) {
            e.preventDefault();
            playShot(parseInt(e.key));
        } else if (e.code === 'Space') {
            e.preventDefault();
            playShot(5);
        }
    });

    function endGame() {
        const overlay = document.getElementById('overlay');
        overlay.classList.remove('hidden');
        overlay.innerHTML = `
            <h3 style="margin:0 0 5px 0;">INNINGS OVER!</h3>
            <p style="font-size:12px; margin:5px 0;"><b>${playerName}</b></p>
            <p style="font-size:15px; color:#b91c1c; font-weight:bold; margin:8px 0;">Final Score: ${gameState.score} / ${gameState.wickets}</p>
            <button class="key" style="background:#2b3822; color:#fff; width:100%; padding:10px; font-size:14px; margin-top:10px;" onclick="startGame()">PLAY AGAIN</button>
        `;
        playBeep(200, 'sawtooth', 0.5);
    }

    function gameLoop() {
        ctx.fillStyle = '#8b9d71';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Oval Boundary Line (Classic Oval Outfield)
        ctx.strokeStyle = '#2b3822';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.ellipse(140, 130, 128, 115, 0, 0, Math.PI * 2);
        ctx.stroke();

        // Pitch Strip
        ctx.fillStyle = '#7a8c60';
        ctx.fillRect(120, 20, 40, 210);
        ctx.strokeStyle = '#2b3822';
        ctx.strokeRect(120, 20, 40, 210);

        // Crease & Stumps
        ctx.beginPath();
        ctx.moveTo(120, 215);
        ctx.lineTo(160, 215);
        ctx.stroke();

        ctx.fillStyle = '#2b3822';
        ctx.fillRect(133, 225, 3, 10);
        ctx.fillRect(137, 225, 3, 10);
        ctx.fillRect(141, 225, 3, 10);

        // Fielders Patrol
        fielders.forEach(f => {
            f.x += f.dir * 0.4;
            if (Math.abs(f.x - f.baseX) > 20) f.dir *= -1;

            ctx.fillStyle = '#2b3822';
            ctx.fillRect(f.x, f.y, 6, 8);
            ctx.fillRect(f.x - 2, f.y - 3, 10, 3);
        });

        // Ball Mechanics
        if (gameState.status === 'BOWLING') {
            gameState.ballY += gameState.ballSpeedY;
            if (gameState.ballY > 235) {
                gameState.status = 'IDLE';
                gameState.wickets++;
                document.getElementById('wickets-val').innerText = gameState.wickets;
                document.getElementById('comm-text').innerText = "BOWLED! Missed completely!";
                playBeep(120, 'sawtooth', 0.4);
                queueNextBall();
            }
        } else if (gameState.status === 'FLYING') {
            gameState.ballX += gameState.ballSpeedX;
            gameState.ballY += gameState.ballSpeedY;

            let distToTarget = Math.hypot(gameState.targetX - gameState.ballX, gameState.targetY - gameState.ballY);
            if (distToTarget < 5 || gameState.ballY < -15 || gameState.ballY > 275 || gameState.ballX < -5 || gameState.ballX > 285) {
                gameState.status = 'IDLE';
                queueNextBall();
            }
        }

        // Draw Ball
        ctx.fillStyle = '#111';
        ctx.fillRect(gameState.ballX - 3, gameState.ballY - 3, 6, 6);

        // Floating Score Popup Effect over pitch
        if (gameState.popupTimer > 0) {
            ctx.fillStyle = '#111';
            ctx.font = 'bold 16px Courier New';
            ctx.fillText(gameState.popupText, 130, 100);
            gameState.popupTimer--;
        }

        // Draw Batsman
        ctx.fillStyle = '#111';
        ctx.fillRect(130, 205, 12, 18);
        ctx.fillRect(132, 200, 8, 5);

        if (gameState.batSwinging) {
            let batX = 122;
            if (gameState.shotDirection === 1) batX = 112;
            if (gameState.shotDirection === 3) batX = 138;
            ctx.fillRect(batX, 198, 16, 5);
            gameState.swingFrame--;
            if (gameState.swingFrame <= 0) gameState.batSwinging = false;
        } else {
            ctx.fillRect(126, 208, 5, 14);
        }

        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>

</body>
</html>
