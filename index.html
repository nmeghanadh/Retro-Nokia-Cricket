<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nokia Retro Cricket 2005 - Enhanced</title>
    <style>
        body {
            background-color: #0f172a;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #f8fafc;
        }
        /* Nokia Phone Frame Styling */
        .phone-body {
            background: #334155;
            padding: 25px;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 2px 5px rgba(255,255,255,0.2);
            border: 4px solid #475569;
            width: 340px;
            text-align: center;
        }
        .brand {
            font-size: 14px;
            font-weight: bold;
            color: #94a3b8;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        /* Authentic Nokia LCD Screen */
        .lcd-screen {
            background: #9ead86; /* Classic Nokia green-tinted monochrome LCD */
            border: 6px solid #2b3822;
            border-radius: 6px;
            padding: 10px;
            width: 300px;
            height: 380px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.4);
            position: relative;
        }
        canvas {
            background: #8b9d71;
            display: block;
            margin: 0 auto;
            border: 2px solid #2b3822;
        }
        .lcd-header {
            font-size: 12px;
            color: #111;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed #2b3822;
            padding-bottom: 4px;
        }
        .lcd-footer {
            font-size: 11px;
            color: #2b3822;
            font-weight: bold;
            text-align: center;
            height: 20px;
        }
        /* Keypad Styling */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 15px;
            padding: 0 10px;
        }
        .key {
            background: #475569;
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 0 #1e293b;
            transition: 0.05s;
        }
        .key:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #1e293b;
        }
        .key-action {
            grid-column: span 3;
            background: #10b981;
            box-shadow: 0 4px 0 #047857;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .screen-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 280px;
            height: 360px;
            background: rgba(158, 173, 134, 0.96);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            color: #111;
            padding: 20px;
            box-sizing: border-box;
        }
        .hidden { display: none !important; }
        input {
            background: #8b9d71;
            border: 2px solid #2b3822;
            padding: 8px;
            font-family: inherit;
            font-weight: bold;
            text-align: center;
            color: #111;
            margin-bottom: 15px;
            width: 80%;
        }
    </style>
</head>
<body>

<div class="phone-body">
    <div class="brand">Nokia 1600 Retro</div>
    
    <div class="lcd-screen">
        
        <!-- START / GAME OVER SCREEN -->
        <div id="overlay" class="screen-overlay">
            <h3 style="margin:0 0 5px 0;">🏏 CRICKET CUP</h3>
            <p style="font-size:11px; margin:5px 0 15px 0; text-align:center;">Time your shots with the SWING button as the ball approaches!</p>
            <input type="text" id="player-name" placeholder="Enter Name" maxlength="10" value="Player 1">
            <button class="key" style="background:#2b3822; color:#fff; width:100%; padding:10px;" onclick="startGame()">START INNINGS</button>
        </div>

        <!-- LCD HEADER -->
        <div class="lcd-header">
            <span>SCR: <b id="score-val">0</b>/<b id="wickets-val">0</b></span>
            <span>BALL: <b id="ball-val">1</b>/6</span>
        </div>

        <!-- CANVAS GAME PITCH & OUTFIELD -->
        <canvas id="gameCanvas" width="276" height="280"></canvas>

        <!-- LCD FOOTER -->
        <div class="lcd-footer" id="comm-text">Press HIT to bat!</div>
    </div>

    <!-- RETRO KEYPAD -->
    <div class="keypad">
        <button class="key" onclick="handleInput()">1</button>
        <button class="key" onclick="handleInput()">2</button>
        <button class="key" onclick="handleInput()">3</button>
        <button class="key" onclick="handleInput()">4</button>
        <button class="key" onclick="handleInput()">5</button>
        <button class="key" onclick="handleInput()">6</button>
        <button class="key key-action" onclick="handleInput()">⚡ SWING / HIT</button>
    </div>
</div>

<script>
    // Authentic 8-bit Nokia sound generator using Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type, duration) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = type || 'square';
        osc.frequency.value = freq || 440;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let gameState = {
        score: 0,
        wickets: 0,
        ball: 1,
        maxBalls: 6,
        status: 'IDLE', // 'IDLE', 'BOWLING', 'FLYING'
        ballX: 138,
        ballY: 30,
        targetX: 138,
        targetY: 30,
        ballSpeedX: 0,
        ballSpeedY: 3,
        batSwinging: false,
        swingFrame: 0
    };

    // Outfield Fielders setup (Patrolling positions)
    let fielders = [
        { x: 50, y: 80, baseX: 50, baseY: 80, dir: 1 },
        { x: 220, y: 80, baseX: 220, baseY: 80, dir: -1 },
        { x: 100, y: 50, baseX: 100, baseY: 50, dir: 1 },
        { x: 180, y: 50, baseX: 180, baseY: 50, dir: -1 }
    ];

    let playerName = "Player 1";

    function startGame() {
        const nameInput = document.getElementById('player-name');
        if (nameInput) {
            playerName = nameInput.value.trim() || "Player 1";
        }
        
        document.getElementById('overlay').classList.add('hidden');
        gameState = {
            score: 0,
            wickets: 0,
            ball: 1,
            maxBalls: 6,
            status: 'IDLE',
            ballX: 138,
            ballY: 30,
            targetX: 138,
            targetY: 30,
            ballSpeedX: 0,
            ballSpeedY: 2.5,
            batSwinging: false,
            swingFrame: 0
        };
        
        document.getElementById('score-val').innerText = '0';
        document.getElementById('wickets-val').innerText = '0';
        document.getElementById('ball-val').innerText = '1';
        
        nextDelivery();
        playBeep(600, 'square', 0.2);
    }

    function nextDelivery() {
        if (gameState.ball > gameState.maxBalls || gameState.wickets >= 3) {
            endGame();
            return;
        }
        gameState.status = 'BOWLING';
        gameState.ballX = 138;
        gameState.ballY = 30;
        gameState.ballSpeedY = 2.5 + Math.random() * 1.5;
        document.getElementById('ball-val').innerText = gameState.ball;
        document.getElementById('comm-text').innerText = "Bowler running in...";
        playBeep(300, 'triangle', 0.1);
    }

    function handleInput() {
        if (gameState.status !== 'BOWLING') return;

        gameState.batSwinging = true;
        gameState.swingFrame = 12;
        playBeep(800, 'square', 0.1);

        // Check timing when ball approaches batsman crease (Y: 220 to 245)
        let batsmanY = 235;
        let timingDiff = Math.abs(gameState.ballY - batsmanY);

        if (timingDiff < 8) {
            // Perfect Timing -> Massive 6 or 4 toward boundary!
            let runs = Math.random() > 0.4 ? 6 : 4;
            gameState.score += runs;
            launchBallFlight(runs === 6 ? 15 : 20, runs === 6 ? 10 : 25, runs);
            playBeep(1200, 'square', 0.3);
        } else if (timingDiff < 18) {
            // Good Timing -> 1 or 2 runs into the gap
            let runs = Math.random() > 0.5 ? 2 : 1;
            gameState.score += runs;
            launchBallFlight(80 + Math.random()*100, 100, runs);
            playBeep(900, 'square', 0.15);
        } else if (timingDiff < 28) {
            // Early/Late -> Defended
            document.getElementById('comm-text').innerText = "Defended safely (0)";
            gameState.status = 'IDLE';
            playBeep(400, 'sawtooth', 0.1);
            queueNextBall();
        } else {
            // Complete Miss -> WICKET!
            gameState.wickets++;
            document.getElementById('comm-text').innerText = "OUT! Timber rattled! ☝️";
            gameState.status = 'IDLE';
            playBeep(150, 'sawtooth', 0.4);
            queueNextBall();
        }

        document.getElementById('score-val').innerText = gameState.score;
        document.getElementById('wickets-val').innerText = gameState.wickets;
    }

    function launchBallFlight(targetX, targetY, runs) {
        gameState.status = 'FLYING';
        gameState.targetX = targetX;
        gameState.targetY = targetY;
        
        // Calculate trajectory vector
        let dx = targetX - gameState.ballX;
        let dy = targetY - gameState.ballY;
        let dist = Math.sqrt(dx*dx + dy*dy);
        
        gameState.ballSpeedX = (dx / dist) * 4;
        gameState.ballSpeedY = (dy / dist) * 4;

        if (runs === 6) {
            document.getElementById('comm-text').innerText = "MAXIMUM! OVER THE ROPE! 🚀";
        } else if (runs === 4) {
            document.getElementById('comm-text').innerText = "FOUR RUNS! Boundary! 💥";
        } else {
            document.getElementById('comm-text').innerText = `Good shot! +${runs} run`;
        }
    }

    function queueNextBall() {
        setTimeout(() => {
            gameState.ball++;
            nextDelivery();
        }, 1500);
    }

    // Keyboard support: Press '5' or Spacebar to bat
    window.addEventListener('keydown', (e) => {
        if (e.key === '5' || e.code === 'Space') {
            e.preventDefault();
            handleInput();
        }
    });

    function endGame() {
        const overlay = document.getElementById('overlay');
        overlay.classList.remove('hidden');
        overlay.innerHTML = `
            <h3 style="margin:0 0 5px 0;">INNINGS OVER!</h3>
            <p style="font-size:12px; margin:5px 0;"><b>${playerName}</b></p>
            <p style="font-size:14px; color:#b91c1c; font-weight:bold; margin:5px 0;">Final Score: ${gameState.score} / ${gameState.wickets}</p>
            <button class="key" style="background:#2b3822; color:#fff; width:100%; padding:8px; margin-top:10px;" onclick="startGame()">PLAY AGAIN</button>
        `;
        playBeep(200, 'sawtooth', 0.5);
    }

    // Main Retro Render Loop with Boundary Lines & Fielders
    function gameLoop() {
        // Clear LCD Screen background
        ctx.fillStyle = '#8b9d71';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // --- DRAW BOUNDARY LINE (Oval boundary rope) ---
        ctx.strokeStyle = '#2b3822';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(138, 140, 130, 125, 0, 0, Math.PI * 2);
        ctx.stroke();

        // --- DRAW PITCH STRIP ---
        ctx.fillStyle = '#7a8c60';
        ctx.fillRect(118, 30, 40, 220);
        ctx.strokeStyle = '#2b3822';
        ctx.strokeRect(118, 30, 40, 220);

        // Crease line
        ctx.beginPath();
        ctx.moveTo(118, 235);
        ctx.lineTo(158, 235);
        ctx.stroke();

        // Stumps at batsman end (Bottom)
        ctx.fillStyle = '#2b3822';
        ctx.fillRect(132, 248, 3, 10);
        ctx.fillRect(136, 248, 3, 10);
        ctx.fillRect(140, 248, 3, 10);

        // --- FIELDERS MOVEMENT & RENDERING ---
        fielders.forEach(f => {
            f.x += f.dir * 0.4;
            if (Math.abs(f.x - f.baseX) > 15) f.dir *= -1; // Patrol back and forth

            // Simple pixel fielder sprite
            ctx.fillStyle = '#2b3822';
            ctx.fillRect(f.x, f.y, 6, 8);
            ctx.fillRect(f.x - 2, f.y - 4, 10, 4); // Head/cap
        });

        // --- BALL PHYSICS & RENDERING ---
        if (gameState.status === 'BOWLING') {
            gameState.ballY += gameState.ballSpeedY;
            // Passed crease without hit -> Wicket!
            if (gameState.ballY > 255) {
                gameState.status = 'IDLE';
                gameState.wickets++;
                document.getElementById('wickets-val').innerText = gameState.wickets;
                document.getElementById('comm-text').innerText = "BOWLED! Missed completely!";
                playBeep(120, 'sawtooth', 0.4);
                queueNextBall();
            }
        } else if (gameState.status === 'FLYING') {
            gameState.ballX += gameState.ballSpeedX;
            gameState.ballY += gameState.ballSpeedY;

            // Stop ball once it reaches target or boundary
            let distToTarget = Math.hypot(gameState.targetX - gameState.ballX, gameState.targetY - gameState.ballY);
            if (distToTarget < 5 || gameState.ballY < 20 || gameState.ballY > 270 || gameState.ballX < 15 || gameState.ballX > 260) {
                gameState.status = 'IDLE';
                queueNextBall();
            }
        }

        // Draw Ball (Pixel Square)
        ctx.fillStyle = '#111';
        ctx.fillRect(gameState.ballX - 3, gameState.ballY - 3, 6, 6);

        // --- DRAW BATSMAN ---
        ctx.fillStyle = '#111';
        ctx.fillRect(128, 225, 12, 20); // Body
        ctx.fillRect(130, 220, 8, 5);  // Helmet

        // Draw Bat
        if (gameState.batSwinging) {
            ctx.fillRect(115, 218, 14, 5); // Horizontal swing
            gameState.swingFrame--;
            if (gameState.swingFrame <= 0) gameState.batSwinging = false;
        } else {
            ctx.fillRect(124, 228, 5, 14); // Standing bat
        }

        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>

</body>
</html>
