<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nokia Retro Cricket 2005</title>
    <style>
        body {
            background-color: #1e293b;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #f8fafc;
        }
        /* Nokia Phone Frame Styling */
        .phone-body {
            background: #334155;
            padding: 25px;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 2px 5px rgba(255,255,255,0.2);
            border: 4px solid #475569;
            width: 340px;
            text-align: center;
        }
        .brand {
            font-size: 14px;
            font-weight: bold;
            color: #94a3b8;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        /* Authentic Nokia LCD Screen */
        .lcd-screen {
            background: #9ead86; /* Classic Nokia green-tinted monochrome LCD */
            border: 6px solid #2b3822;
            border-radius: 6px;
            padding: 10px;
            width: 300px;
            height: 360px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.4);
        }
        canvas {
            background: #8b9d71;
            display: block;
            margin: 0 auto;
            border: 2px solid #2b3822;
        }
        .lcd-header {
            font-size: 12px;
            color: #111;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed #2b3822;
            padding-bottom: 4px;
        }
        .lcd-footer {
            font-size: 11px;
            color: #2b3822;
            font-weight: bold;
            text-align: center;
        }
        /* Keypad Styling */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 20px;
            padding: 0 10px;
        }
        .key {
            background: #475569;
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 0 #1e293b;
            transition: 0.05s;
        }
        .key:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #1e293b;
        }
        .key-action {
            grid-column: span 3;
            background: #10b981;
            box-shadow: 0 4px 0 #047857;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .screen-overlay {
            position: absolute;
            width: 280px;
            height: 340px;
            background: rgba(158, 173, 134, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            color: #111;
            padding: 20px;
            box-sizing: border-box;
        }
        .hidden { display: none !important; }
        input {
            background: #8b9d71;
            border: 2px solid #2b3822;
            padding: 8px;
            font-family: inherit;
            font-weight: bold;
            text-align: center;
            color: #111;
            margin-bottom: 10px;
            width: 80%;
        }
    </style>
</head>
<body>

<div class="phone-body">
    <div class="brand">Nokia 1100 Retro</div>
    
    <div class="lcd-screen" style="position: relative;">
        
        <!-- START / GAME OVER SCREEN -->
        <div id="overlay" class="screen-overlay">
            <h3 style="margin:0 0 5px 0;">🏏 CRICKET CUP</h3>
            <p style="font-size:11px; margin:5px 0 15px 0; text-align:center;">Press 5 or Bat button to time your shots perfectly!</p>
            <input type="text5" id="player-name" placeholder="Enter Name" maxlength="10" value="Player 1">
            <button class="key" style="background:#2b3822; color:#fff; width:100%; padding:10px;" onclick="startGame()">START INNINGS</button>
        </div>

        <!-- LCD HEADER -->
        <div class="lcd-header">
            <span>SCR: <b id="score-val">0</b>/<b id="wickets-val">0</b></span>
            <span>BALL: <b id="ball-val">1</b>/6</span>
        </div>

        <!-- CANVAS GAME PITCH -->
        <canvas id="gameCanvas" width="276" height="260"></canvas>

        <!-- LCD FOOTER -->
        <div class="lcd-footer" id="comm-text">Press HIT to bat!</div>
    </div>

    <!-- RETRO KEYPAD -->
    <div class="keypad">
        <button class="key" onclick="handleInput()">1</button>
        <button class="key" onclick="handleInput()">2</button>
        <button class="key" onclick="handleInput()">3</button>
        <button class="key" onclick="handleInput()">4</button>
        <button class="key" onclick="handleInput()">5</button>
        <button class="key" onclick="handleInput()">6</button>
        <button class="key key-action" onclick="handleInput()">⚡ SWING / HIT (5)</button>
    </div>
</div>

<script>
    // Audio context for authentic 8-bit Nokia beeps
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type, duration) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = type || 'square';
        osc.frequency.value = freq || 440;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let gameState = {
        score: 0,
        wickets: 0,
        ball: 1,
        maxBalls: 6,
        ballActive: false,
        ballY: 20,
        ballSpeed: 3,
        batSwinging: false,
        swingFrame: 0
    };

    let playerName = "Player";
    let gameInterval;

    function startGame() {
        playerName = document.getElementById('player-name').value.trim() || "Player";
        document.getElementById('overlay').classList.add('hidden');
        gameState = { score: 0, wickets: 0, ball: 1, maxBalls: 6, ballActive: false, ballY: 20, ballSpeed: 3, batSwinging: false, swingFrame: 0 };
        nextDelivery();
        playBeep(600, 'square', 0.2);
    }

    function nextDelivery() {
        if (gameState.ball > gameState.maxBalls || gameState.wickets >= 3) {
            endGame();
            return;
        }
        gameState.ballActive = true;
        gameState.ballY = 20;
        gameState.ballSpeed = 2.5 + Math.random() * 1.5; // Random delivery speed
        document.getElementById('ball-val').innerText = gameState.ball;
        document.getElementById('comm-text').innerText = "Bowler running in...";
        playBeep(300, 'triangle', 0.1);
    }

    function handleInput() {
        if (!gameState.ballActive) return;

        gameState.batSwinging = true;
        gameState.swingFrame = 10;
        playBeep(800, 'square', 0.1);

        // Check timing where ball crosses crease (Y: 200 to 225)
        let timingDiff = Math.abs(gameState.ballY - 212);

        if (timingDiff < 10) {
            // Perfect Timing! 4 or 6 runs
            let runs = Math.random() > 0.4 ? 6 : 4;
            gameState.score += runs;
            document.getElementById('comm-text').innerText = `SMASHED A ${runs} RUNS! 💥`;
            playBeep(1200, 'square', 0.3);
        } else if (timingDiff < 22) {
            // Good Timing: 1 or 2 runs
            let runs = Math.random() > 0.5 ? 2 : 1;
            gameState.score += runs;
            document.getElementById('comm-text').innerText = `Good shot! +${runs} run`;
            playBeep(900, 'square', 0.15);
        } else if (timingDiff < 35) {
            // Too early or late: Dot ball
            document.getElementById('comm-text').innerText = "Defended safely (0)";
            playBeep(400, 'sawtooth', 0.1);
        } else {
            // Complete miss -> WICKET!
            gameState.wickets++;
            document.getElementById('comm-text').innerText = "OUT! Timber rattled! ☝️";
            playBeep(150, 'sawtooth', 0.4);
        }

        gameState.ballActive = false;
        document.getElementById('score-val').innerText = gameState.score;
        document.getElementById('wickets-val').innerText = gameState.wickets;

        setTimeout(() => {
            gameState.ball++;
            nextDelivery();
        }, 1200);
    }

    // Keyboard support: Press '5' or Spacebar to bat
    window.addEventListener('keydown', (e) => {
        if (e.key === '5' || e.code === 'Space') {
            e.preventDefault();
            handleInput();
        }
    });

    function endGame() {
        const overlay = document.getElementById('overlay');
        overlay.classList.remove('hidden');
        overlay.innerHTML = `
            <h3 style="margin:0 0 5px 0;">INNINGS OVER!</h3>
            <p style="font-size:12px; margin:5px 0;"><b>${playerName}</b></p>
            <p style="font-size:14px; color:#b91c1c; font-weight:bold; margin:5px 0;">Final Score: ${gameState.score} / ${gameState.wickets}</p>
            <button class="key" style="background:#2b3822; color:#fff; width:100%; padding:8px; margin-top:10px;" onclick="startGame()">PLAY AGAIN</button>
        `;
        playBeep(200, 'sawtooth', 0.5);
    }

    // Main Retro Render Loop
    function gameLoop() {
        // Clear LCD Screen background
        ctx.fillStyle = '#8b9d71';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Pitch Grid Lines
        ctx.strokeStyle = '#2b3822';
        ctx.lineWidth = 2;
        // Pitch strip
        ctx.strokeRect(108, 0, 60, 260);

        // Crease line
        ctx.beginPath();
        ctx.moveTo(108, 212);
        ctx.lineTo(168, 212);
        ctx.stroke();

        // Stumps at batsman end
        ctx.fillStyle = '#2b3822';
        ctx.fillRect(132, 235, 3, 15);
        ctx.fillRect(138, 235, 3, 15);
        ctx.fillRect(144, 235, 3, 15);

        // Update ball physics if active
        if (gameState.ballActive) {
            gameState.ballY += gameState.ballSpeed;
            // Passed crease without hit -> Wicket!
            if (gameState.ballY > 245) {
                gameState.ballActive = false;
                gameState.wickets++;
                document.getElementById('wickets-val').innerText = gameState.wickets;
                document.getElementById('comm-text').innerText = "BOWLED! Missed completely!";
                playBeep(120, 'sawtooth', 0.4);
                setTimeout(() => {
                    gameState.ball++;
                    nextDelivery();
                }, 1200);
            }
        }

        // Draw Ball (Retro Pixel Square)
        if (gameState.ballActive) {
            ctx.fillStyle = '#111';
            ctx.fillRect(135, gameState.ballY, 6, 6);
        }

        // Draw Batsman (Retro Pixel Art)
        ctx.fillStyle = '#111';
        // Body & Helmet
        ctx.fillRect(128, 205, 12, 20);
        ctx.fillRect(130, 200, 8, 6);

        // Draw Bat if swinging
        if (gameState.batSwinging) {
            ctx.fillRect(115, 195, 12, 6); // Horizontal swing
            gameState.swingFrame--;
            if (gameState.swingFrame <= 0) gameState.batSwinging = false;
        } else {
            ctx.fillRect(124, 208, 6, 14); // Standing bat
        }

        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>

</body>
</html>
