<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nokia Retro Cricket 2006 - Ultimate Edition</title>
    <style>
        body {
            background-color: #0f172a;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #f8fafc;
        }
        /* Nokia Phone Frame Styling */
        .phone-body {
            background: #334155;
            padding: 25px;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 2px 5px rgba(255,255,255,0.2);
            border: 4px solid #475569;
            width: 340px;
            text-align: center;
        }
        .brand {
            font-size: 14px;
            font-weight: bold;
            color: #94a3b8;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        /* Authentic Nokia LCD Screen */
        .lcd-screen {
            background: #9ead86; /* Classic green-tinted monochrome LCD */
            border: 6px solid #2b3822;
            border-radius: 6px;
            padding: 10px;
            width: 300px;
            height: 390px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.4);
            position: relative;
        }
        canvas {
            background: #8b9d71;
            display: block;
            margin: 0 auto;
            border: 2px solid #2b3822;
        }
        .lcd-header {
            font-size: 12px;
            color: #111;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed #2b3822;
            padding-bottom: 4px;
        }
        .lcd-footer {
            font-size: 11px;
            color: #2b3822;
            font-weight: bold;
            text-align: center;
            height: 22px;
        }
        /* Keypad Styling */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 15px;
            padding: 0 5px;
        }
        .key {
            background: #475569;
            color: #fff;
            border: none;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 0 #1e293b;
            transition: 0.05s;
        }
        .key:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #1e293b;
        }
        .key-action {
            background: #10b981;
            box-shadow: 0 4px 0 #047857;
            font-size: 12px;
        }
        .screen-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 280px;
            height: 370px;
            background: rgba(158, 173, 134, 0.96);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            color: #111;
            padding: 20px;
            box-sizing: border-box;
        }
        .hidden { display: none !important; }
        input {
            background: #8b9d71;
            border: 2px solid #2b3822;
            padding: 8px;
            font-family: inherit;
            font-weight: bold;
            text-align: center;
            color: #111;
            margin-bottom: 15px;
            width: 80%;
        }
    </style>
</head>
<body>

<div class="phone-body">
    <div class="brand">Nokia 1110i (2006)</div>
    
    <div class="lcd-screen">
        
        <!-- START / GAME OVER SCREEN -->
        <div id="overlay" class="screen-overlay">
            <h3 style="margin:0 0 5px 0;">🏏 RETRO CRICKET 2006</h3>
            <p style="font-size:11px; margin:5px 0 15px 0; text-align:center;">
                <b>Controls:</b><br>
                [1] Left Shot | [3] Right Shot<br>
                [4] Lofted Drive | [6] Straight Hit<br>
                Watch out for fielders taking catches!
            </p>
            <input type="text" id="player-name" placeholder="Batsman Name" maxlength="10" value="Legend">
            <button class="key" style="background:#2b3822; color:#fff; width:100%; padding:10px;" onclick="startGame()">START INNINGS</button>
        </div>

        <!-- LCD HEADER -->
        <div class="lcd-header">
            <span>SCR: <b id="score-val">0</b>/<b id="wickets-val">0</b></span>
            <span>BALL: <b id="ball-val">1</b>/6</span>
        </div>

        <!-- CANVAS GAME PITCH & OUTFIELD -->
        <canvas id="gameCanvas" width="276" height="270"></canvas>

        <!-- LCD FOOTER -->
        <div class="lcd-footer" id="comm-text">Press a shot key [1,3,4,6]!</div>
    </div>

    <!-- RETRO KEYPAD -->
    <div class="keypad">
        <button class="key" onclick="playShot(1)">1<br><small>Left</small></button>
        <button class="key" onclick="playShot(2)">2<br><small>Defend</small></button>
        <button class="key" onclick="playShot(3)">3<br><small>Right</small></button>
        <button class="key" onclick="playShot(4)">4<br><small>Lofted</small></button>
        <button class="key" onclick="playShot(5)">5<br><small>Straight</small></button>
        <button class="key" onclick="playShot(6)">6<br><small>Power</small></button>
        <button class="key key-action" style="grid-column: span 3;" onclick="playShot(5)">⚡ QUICK HIT (5 / Space)</button>
    </div>
</div>

<script>
    // Authentic 8-bit Nokia sound generator
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type, duration) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = type || 'square';
        osc.frequency.value = freq || 440;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let gameState = {
        score: 0,
        wickets: 0,
        ball: 1,
        maxBalls: 6,
        status: 'IDLE', // 'IDLE', 'BOWLING', 'FLYING'
        ballX: 138,
        ballY: 30,
        targetX: 138,
        targetY: 30,
        ballSpeedX: 0,
        ballSpeedY: 2.5,
        batSwinging: false,
        swingFrame: 0,
        shotDirection: 5
    };

    // Outfield Fielders patrolling the boundary and inner ring
    let fielders = [
        { x: 50, y: 70, baseX: 50, baseY: 70, dir: 1 },   // Deep Cover
        { x: 220, y: 70, baseX: 220, baseY: 70, dir: -1 }, // Deep Midwicket
        { x: 100, y: 40, baseX: 100, baseY: 40, dir: 1 },  // Long Off
        { x: 170, y: 40, baseX: 170, baseY: 40, dir: -1 }  // Long On
    ];

    let playerName = "Legend";

    function startGame() {
        const nameInput = document.getElementById('player-name');
        if (nameInput) {
            playerName = nameInput.value.trim() || "Legend";
        }
        
        document.getElementById('overlay').classList.add('hidden');
        gameState = {
            score: 0,
            wickets: 0,
            ball: 1,
            maxBalls: 6,
            status: 'IDLE',
            ballX: 138,
            ballY: 30,
            targetX: 138,
            targetY: 30,
            ballSpeedX: 0,
            ballSpeedY: 2.5,
            batSwinging: false,
            swingFrame: 0,
            shotDirection: 5
        };
        
        document.getElementById('score-val').innerText = '0';
        document.getElementById('wickets-val').innerText = '0';
        document.getElementById('ball-val').innerText = '1';
        
        nextDelivery();
        playBeep(600, 'square', 0.2);
    }

    function nextDelivery() {
        if (gameState.ball > gameState.maxBalls || gameState.wickets >= 3) {
            endGame();
            return;
        }
        gameState.status = 'BOWLING';
        gameState.ballX = 138;
        gameState.ballY = 30;
        gameState.ballSpeedY = 2.2 + Math.random() * 1.6;
        document.getElementById('ball-val').innerText = gameState.ball;
        document.getElementById('comm-text').innerText = "Bowler running in...";
        playBeep(300, 'triangle', 0.1);
    }

    function playShot(direction) {
        if (gameState.status !== 'BOWLING') return;

        gameState.shotDirection = direction;
        gameState.batSwinging = true;
        gameState.swingFrame = 12;
        playBeep(800, 'square', 0.1);

        // Check timing at batsman crease (Y: 220 to 245)
        let batsmanY = 230;
        let timingDiff = Math.abs(gameState.ballY - batsmanY);

        if (timingDiff < 9) {
            // Perfect Timing -> Boundary or Potential Catch!
            processBattingContact(true);
        } else if (timingDiff < 19) {
            // Good Timing -> 1 or 2 runs
            processBattingContact(false);
        } else if (timingDiff < 28) {
            // Defended
            document.getElementById('comm-text').innerText = "Defended safely (0)";
            gameState.status = 'IDLE';
            playBeep(400, 'sawtooth', 0.1);
            queueNextBall();
        } else {
            // Miss -> Clean Bowled!
            gameState.wickets++;
            document.getElementById('comm-text').innerText = "BOWLED! Timber rattled! ☝️";
            gameState.status = 'IDLE';
            playBeep(150, 'sawtooth', 0.4);
            queueNextBall();
        }

        document.getElementById('score-val').innerText = gameState.score;
        document.getElementById('wickets-val').innerText = gameState.wickets;
    }

    function processBattingContact(isPerfect) {
        let targetX = 138;
        let targetY = 20;
        let runs = 1;

        // Direction based on keypad choice [1, 3, 4, 5, 6]
        if (gameState.shotDirection === 1) {
            targetX = 40 + Math.random() * 30;  // Left Side (Cover)
            targetY = 60 + Math.random() * 40;
            runs = isPerfect ? 4 : 1;
        } else if (gameState.shotDirection === 3) {
            targetX = 200 + Math.random() * 30; // Right Side (Midwicket)
            targetY = 60 + Math.random() * 40;
            runs = isPerfect ? 4 : 1;
        } else if (gameState.shotDirection === 4 || gameState.shotDirection === 6) {
            targetX = 100 + Math.random() * 80; // Lofted Straight / Power Slog
            targetY = 25 + Math.random() * 20;  // Deep boundary
            runs = isPerfect ? 6 : 2;
        } else {
            targetX = 138 + (Math.random() * 40 - 20); // Straight drive
            targetY = 30;
            runs = isPerfect ? 4 : 2;
        }

        // --- CAUGHT OUT CHECK ---
        // Check if the ball lands dangerously close to any patrolling fielder!
        let caughtOut = false;
        if (isPerfect && (gameState.shotDirection === 4 || gameState.shotDirection === 6)) {
            fielders.forEach(f => {
                let distToFielder = Math.hypot(f.x - targetX, f.y - targetY);
                if (distToFielder < 22) {
                    caughtOut = true; // Fielder was stationed right under the ball!
                }
            });
        }

        if (caughtOut) {
            gameState.wickets++;
            gameState.status = 'FLYING';
            gameState.targetX = targetX;
            gameState.targetY = targetY;
            document.getElementById('comm-text').innerText = "CAUGHT OUT near the boundary! ☝️";
            playBeep(120, 'sawtooth', 0.5);
            
            // Animate ball flying to fielder then stopping
            let dx = targetX - gameState.ballX;
            let dy = targetY - gameState.ballY;
            let dist = Math.sqrt(dx*dx + dy*dy);
            gameState.ballSpeedX = (dx / dist) * 4;
            gameState.ballSpeedY = (dy / dist) * 4;
            queueNextBall();
            return;
        }

        // Normal scoring shot
        gameState.score += runs;
        launchBallFlight(targetX, targetY, runs);
        if (runs === 6) {
            playBeep(1200, 'square', 0.3);
        } else {
            playBeep(900, 'square', 0.15);
        }
    }

    function launchBallFlight(targetX, targetY, runs) {
        gameState.status = 'FLYING';
        gameState.targetX = targetX;
        gameState.targetY = targetY;
        
        let dx = targetX - gameState.ballX;
        let dy = targetY - gameState.ballY;
        let dist = Math.sqrt(dx*dx + dy*dy);
        
        gameState.ballSpeedX = (dx / dist) * 4;
        gameState.ballSpeedY = (dy / dist) * 4;

        if (runs === 6) {
            document.getElementById('comm-text').innerText = "MAXIMUM! OVER THE ROPE! 🚀";
        } else if (runs === 4) {
            document.getElementById('comm-text').innerText = "FOUR RUNS! Boundary! 💥";
        } else {
            document.getElementById('comm-text').innerText = `Good placement! +${runs} run`;
        }
    }

    function queueNextBall() {
        setTimeout(() => {
            gameState.ball++;
            nextDelivery();
        }, 1600);
    }

    // Keyboard support: Numbers 1, 3, 4, 6 for shot selection, 5/Space for straight hit
    window.addEventListener('keydown', (e) => {
        if (['1', '3', '4', '5', '6'].includes(e.key)) {
            e.preventDefault();
            playShot(parseInt(e.key));
        } else if (e.code === 'Space') {
            e.preventDefault();
            playShot(5);
        }
    });

    function endGame() {
        const overlay = document.getElementById('overlay');
        overlay.classList.remove('hidden');
        overlay.innerHTML = `
            <h3 style="margin:0 0 5px 0;">INNINGS OVER!</h3>
            <p style="font-size:12px; margin:5px 0;"><b>${playerName}</b></p>
            <p style="font-size:14px; color:#b91c1c; font-weight:bold; margin:5px 0;">Final Score: ${gameState.score} / ${gameState.wickets}</p>
            <button class="key" style="background:#2b3822; color:#fff; width:100%; padding:8px; margin-top:10px;" onclick="startGame()">PLAY AGAIN</button>
        `;
        playBeep(200, 'sawtooth', 0.5);
    }

    // Main Game Loop
    function gameLoop() {
        ctx.fillStyle = '#8b9d71';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Boundary line oval
        ctx.strokeStyle = '#2b3822';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(138, 135, 126, 120, 0, 0, Math.PI * 2);
        ctx.stroke();

        // Pitch strip
        ctx.fillStyle = '#7a8c60';
        ctx.fillRect(118, 30, 40, 215);
        ctx.strokeStyle = '#2b3822';
        ctx.strokeRect(118, 30, 40, 215);

        // Crease line & stumps
        ctx.beginPath();
        ctx.moveTo(118, 230);
        ctx.lineTo(158, 230);
        ctx.stroke();

        ctx.fillStyle = '#2b3822';
        ctx.fillRect(132, 242, 3, 10);
        ctx.fillRect(136, 242, 3, 10);
        ctx.fillRect(140, 242, 3, 10);

        // Fielders patrolling
        fielders.forEach(f => {
            f.x += f.dir * 0.35;
            if (Math.abs(f.x - f.baseX) > 18) f.dir *= -1;

            ctx.fillStyle = '#2b3822';
            ctx.fillRect(f.x, f.y, 6, 8);
            ctx.fillRect(f.x - 2, f.y - 3, 10, 3); // Fielder cap
        });

        // Ball physics
        if (gameState.status === 'BOWLING') {
            gameState.ballY += gameState.ballSpeedY;
            if (gameState.ballY > 250) {
                gameState.status = 'IDLE';
                gameState.wickets++;
                document.getElementById('wickets-val').innerText = gameState.wickets;
                document.getElementById('comm-text').innerText = "BOWLED! Missed completely!";
                playBeep(120, 'sawtooth', 0.4);
                queueNextBall();
            }
        } else if (gameState.status === 'FLYING') {
            gameState.ballX += gameState.ballSpeedX;
            gameState.ballY += gameState.ballSpeedY;

            let distToTarget = Math.hypot(gameState.targetX - gameState.ballX, gameState.targetY - gameState.ballY);
            if (distToTarget < 5 || gameState.ballY < 15 || gameState.ballY > 260 || gameState.ballX < 10 || gameState.ballX > 265) {
                gameState.status = 'IDLE';
                queueNextBall();
            }
        }

        // Draw Ball
        ctx.fillStyle = '#111';
        ctx.fillRect(gameState.ballX - 3, gameState.ballY - 3, 6, 6);

        // Draw Batsman & Direction indicator
        ctx.fillStyle = '#111';
        ctx.fillRect(128, 220, 12, 18);
        ctx.fillRect(130, 215, 8, 5);

        if (gameState.batSwinging) {
            let batX = 120;
            if (gameState.shotDirection === 1) batX = 110;
            if (gameState.shotDirection === 3) batX = 135;
            ctx.fillRect(batX, 213, 16, 5);
            gameState.swingFrame--;
            if (gameState.swingFrame <= 0) gameState.batSwinging = false;
        } else {
            ctx.fillRect(124, 223, 5, 14);
        }

        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>

</body>
</html>
